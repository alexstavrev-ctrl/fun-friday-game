<style>
/* Layout: one screen, one question. Thin top strip (story stamps + teacher buttons), giant prompt, one row of big picture cards, Next at bottom right.
   Single bright look on purpose: it is a TV game. Every size is in --u, 1% of a 16:9 stage that always fits the screen, so a 4:3 iPad shows the same picture as the TV. */
:root{
  --sky:#DDF0FF; --card:#FFFFFF; --ink:#12305C; --blue:#1F6FD6; --sun:#FFC62E; --go:#1FA35B; --stop:#D8342B; --soft:#8FA6C4;

}
html{height:100%}

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(var(--u)*1.5);
  box-sizing:border-box;display:flex;flex-direction:column;gap:calc(var(--u)*1.5);overflow-x:hidden}

.stamps{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1);flex:1;min-width:0}
.stamp{width:clamp(18px,calc(var(--u)*4),52px);aspect-ratio:1;border-radius:50%;border:calc(var(--u)*.4) dashed var(--soft);display:grid;place-items:center;font-size:clamp(10px,calc(var(--u)*2.2),30px);font-weight:800;box-sizing:border-box}
.stamp.now{border-style:solid;border-color:var(--blue);background:#fff}
.stamp.done{border:none;background:var(--sun)}
.stamp.done.art{background:none}
.stamp.art img.ai{width:2em;height:2em;max-width:none;vertical-align:0}
.fly img.ai{width:1.25em;height:1.25em;vertical-align:0}
.tool{background:#fff;border:calc(var(--u)*.3) solid var(--soft);border-radius:99px;padding:.35em 1em;font-size:clamp(13px,calc(var(--u)*2),26px);font-weight:800}
.tool[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

h1 b{color:var(--blue)}
.hint{text-align:center;font-size:clamp(15px,calc(var(--u)*3),40px);margin:0;color:var(--blue);font-weight:800}
.choices{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:calc(var(--u)*3.5);max-width:calc(var(--u)*170);width:100%;margin:0 auto}
.choice{background:var(--card);border:calc(var(--u)*.6) solid transparent;border-radius:calc(var(--u)*3);padding:calc(var(--u)*2) calc(var(--u)*1);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1);
  box-shadow:0 calc(var(--u)*.8) 0 rgba(18,48,92,.18);transition:transform .15s,opacity .5s}
/* cards deal in when a screen opens (they are visible the whole time, they only settle into place) */
.choice{animation:deal .45s cubic-bezier(.2,1.3,.4,1) backwards;animation-delay:calc(var(--i,0)*70ms)}

.bills{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.8)}

.choice.yes::before,.choice.pick::before{content:"\2713";position:absolute;z-index:1;top:calc(var(--u)*-2);right:calc(var(--u)*-2);width:calc(var(--u)*7.5);height:calc(var(--u)*7.5);border-radius:50%;background:var(--go);color:#fff;border:calc(var(--u)*.6) solid #fff;box-sizing:border-box;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:calc(var(--u)*5);line-height:1;animation:stampin .4s cubic-bezier(.3,1.7,.5,1) backwards}
main.dense .choice.yes::before{width:calc(var(--u)*5.6);height:calc(var(--u)*5.6);font-size:calc(var(--u)*3.8);top:calc(var(--u)*-1.4);right:calc(var(--u)*-1.4)}
.choice.no{border-color:var(--stop);background:#FDEBEA;pointer-events:none;animation:shake .45s}
/* a wash over the whole card dims a wrong choice; opacity on the picture alone would break its blend with the card */
.choice{position:relative}
.choice.no::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(253,235,234,.6)}
.choice.soft{opacity:.25;pointer-events:none;animation:wob .5s}

@keyframes deal{from{transform:translateY(calc(var(--u)*5)) scale(.9)}}
@keyframes stampin{from{transform:scale(0) rotate(-40deg)}}
@keyframes rise{from{transform:translateY(calc(var(--u)*3))}}
@keyframes cheer{from{transform:scale(.6)}}
@keyframes land{from{transform:scale(1.9)}}

main.enter h1,main.enter .nl{animation:rise .4s cubic-bezier(.2,1.2,.4,1)}

<script>
/* Wrong taps: red frame + soft sound on every screen. Set to false to keep the red frame on the aisle screen only (other screens wobble and fade). */
const RED_EVERYWHERE=true;

let clockN=0;
function clock(h,m=0){
  const a=(h%12+m/60)*30*Math.PI/180, x=50+22*Math.sin(a), y=50-22*Math.cos(a), ma=m*6*Math.PI/180, mx=50+30*Math.sin(ma), my=50-30*Math.cos(ma);
  const art=HAVE.has('clockface'), nr=art?38:37, fs=art?11:10; /* art = the colored pencil clock face; the numbers and hands stay exact, drawn on top */
  let t='';for(let i=1;i<=12;i++){const b=i*30*Math.PI/180;t+=`<text x="${50+nr*Math.sin(b)}" y="${50-nr*Math.cos(b)+fs*.36}" font-size="${fs}" font-weight="800" text-anchor="middle" fill="#12305C" font-family="Arial">${i}</text>`}
  const hands=`${t}<line x1="50" y1="50" x2="${mx}" y2="${my}" stroke="#1F6FD6" stroke-width="3" stroke-linecap="round"/><line x1="50" y1="50" x2="${x}" y2="${y}" stroke="#12305C" stroke-width="5" stroke-linecap="round"/><circle cx="50" cy="50" r="3.5" fill="#12305C"/>`;
  if(art){const id='cf'+(++clockN);return `<svg viewBox="5.3 4.7 89 89" role="img" aria-label="clock"><clipPath id="${id}"><circle cx="49.8" cy="49.2" r="43.7"/></clipPath><image href="${DIR}clockface.png" x="0" y="0" width="100" height="100" clip-path="url(#${id})"/><g transform="translate(49.8 49.2) scale(.778) translate(-50 -50)">${hands}</g></svg>`}
  return `<svg viewBox="0 0 100 100" role="img" aria-label="clock"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#12305C" stroke-width="4"/>${hands}</svg>`;
}
/* Pictures. A key listed in HAVE shows the file assets/<key>.png in place of its emoji, so pictures can arrive a few at a time. */
const HAVE=new Set(window.WARMUP_HAVE||['rocket','dinosaur','walk','swim','bus','elephant','skateboard','sailboat','run','buckle','yell','quiet','store','rollercoaster','panda','pizza','teddy','yoyo','shirt','jeans','apple','banana','bread','cupcake','socks','grapes','toothbrush','orange','ball','gamepad','cubmeal','chickenbowl','chowmein','pasta','maccheese','bill1','bill5','star','clockface','cart','shop-panda','shop-lascari','shop-burger','shop-sub','cheeseburger','nuggets','chickensandwich','turkeysub','meatballsub','veggiesub','soda','pepper','papermap','shop-jersey','shoppingbag','chips']);
const DIR=window.WARMUP_DIR||'assets/';
function P(k,e){return HAVE.has(k)?'<img class="ai" src="'+DIR+k+'.png" alt="">':e}
HAVE.forEach(k=>{const im=new Image();im.src=DIR+k+'.png'}); /* fetch every picture up front so a new screen never shows empty cards */

/* ---------- sounds: all made in the browser, nothing to download ---------- */
function ac(){
  if(!sound)return null;
  try{
    if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain();master.gain.value=.9;
      const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
      const echo=ctx.createDelay(),back=ctx.createGain(),wet=ctx.createGain();echo.delayTime.value=.17;back.gain.value=.24;wet.gain.value=.22;
      master.connect(echo);echo.connect(back);back.connect(echo);echo.connect(wet);wet.connect(comp);}
    if(ctx.state==='suspended')ctx.resume();
    return ctx;
  }catch(e){return null}
}
function note(f,at,len,o){
  const c=ac();if(!c)return;o=o||{};
  try{const t=c.currentTime+at,osc=c.createOscillator(),g=c.createGain(),vol=o.vol||.2;
    osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+len);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+len);
    osc.connect(g);g.connect(master);osc.start(t);osc.stop(t+len+.05);}catch(e){}
}
function bell(f,at,vol){vol=vol||.2;note(f,at,.9,{vol:vol});note(f*2,at,.45,{vol:vol*.35});note(f*3.01,at,.25,{vol:vol*.14})}
function hiss(at,len,o){
  const c=ac();if(!c)return;o=o||{};
  try{const t=c.currentTime+at,n=Math.max(1,Math.floor(c.sampleRate*len)),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
    for(let k=0;k<n;k++)d[k]=Math.random()*2-1;
    const src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),vol=o.vol||.1;src.buffer=buf;f.type='bandpass';f.Q.value=o.q||.8;
    f.frequency.setValueAtTime(o.from||600,t);f.frequency.exponentialRampToValueAtTime(o.to||3000,t+len);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+len*.3);g.gain.exponentialRampToValueAtTime(.0001,t+len);
    src.connect(f);f.connect(g);g.connect(master);src.start(t);}catch(e){}
}

  bd.addEventListener('input',()=>{clean(bd,'d');SFX.key();if(bd.value.length===2)bc.focus()});
  bc.addEventListener('input',()=>{clean(bc,'c');SFX.key()});
  bd.addEventListener('keydown',e=>{if(e.key==='.'||e.key===','||e.key==='Tab'&&!e.shiftKey){e.preventDefault();bc.focus()}else if(e.key==='Enter'){e.preventDefault();checkBill()}});
  bc.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!bc.value||e.key==='Tab'&&e.shiftKey){e.preventDefault();bd.focus()}else if(e.key==='Enter'){e.preventDefault();checkBill()}else if(e.key==='.'||e.key===',')e.preventDefault()});
  if(billDone){bd.disabled=bc.disabled=true}else setTimeout(()=>{try{(ent.d.length===2||ent.c?bc:bd).focus({preventScroll:true})}catch(e){}},80);
}
/* a typed key that lands outside the boxes still goes in */
function billKey(k){const el=ent.d.length<2&&!ent.c?$('bd'):$('bc');el.focus();el.value=(el.value+k).slice(0,2);el.dispatchEvent(new Event('input'))}
function checkBill(){
  if(billDone)return;const {T,L}=BILL,D=Math.floor(T/100),C=T%100,r=$('rcpt');
  if(!ent.d||!ent.c){say('Type the dollars and the cents.',true);SFX.click();(ent.d?$('bc'):$('bd')).focus();return}
  if(ent.c.length<2){say('Cents need two numbers, like 05.',true);SFX.click();$('bc').focus();return}
  const d=+ent.d,c=+ent.c,v=d*100+c;
  if(v===T){billDone=true;r.classList.remove('wrong');r.classList.add('bill-ok');r.insertAdjacentHTML('beforeend','<span class="paid">PAID</span>');bigWin(r);
    $('bd').disabled=$('bc').disabled=true;finish(r.querySelector('.rtot'));say('You got it! The total is '+money(T)+'.');return}
  tries++;SFX.oops();r.classList.remove('wrong');void r.offsetWidth;r.classList.add('wrong');
  const carry=L.reduce((a,x)=>a+x.c%100,0)>=100,parts=[];
  for(let mk=1;mk<(1<<L.length)-1;mk++){let t=0;L.forEach((x,k)=>{if(mk>>k&1)t+=x.c});parts.push(t)}
  let msg='Not yet. Add the prices again.';
  if(L.length>1&&L.some(x=>x.c===v))msg='That is one price. Add all the prices.';
  else if(parts.includes(v))msg='You missed a price. Add them all.';
  else if(carry&&c===C&&d===D-1)msg='Almost! The cents make one more dollar.';
  else if(d===D)msg='The dollars are right! Check the cents.';
  else if(c===C)msg='The cents are right! Check the dollars.';
  say(msg,true);
  if(tries===2){r.classList.add('lit');$('hint').hidden=false;$('hint').textContent='Add the cents first. Then add the dollars.'}
}

/* Opening page. It shows once, before question 1. The first tap starts the game and wakes the sound (a browser stays silent until someone taps). */
let opened=false;
function showOpen(){
  const f=$('ofull');if(window.WARMUP_OPENING!==false&&!f.dataset.tried){f.dataset.tried=1;f.onload=()=>{f.hidden=false;$('open').classList.add('art')};f.onerror=()=>{if(!f.dataset.draft){f.dataset.draft=1;f.onload=()=>{f.hidden=false;$('open').classList.add('art','draft')};f.src=DIR+'opening-draft.webp'}else f.hidden=true};f.src=DIR+'opening-full.webp'}
  opened=false;$('startbtn').disabled=false;$('open').classList.remove('leave');$('open').hidden=false;
}
/* Only the button starts (Astra's opening design). The tap also wakes the sound: a browser stays silent until someone taps. */
$('startbtn').onclick=()=>{
  if(opened)return;opened=true;$('startbtn').disabled=true;const o=$('open');
  try{SFX.chime();SFX.honk()}catch(e){}
  o.classList.add('leave');
  setTimeout(()=>{o.hidden=true;o.classList.remove('leave');render();sayQ(SCREENS[i])},calm?0:220);
};
function go(n){const ws=$('winstage');if(ws)WINFX.stop(ws);if(n<0&&i===0){hush();showOpen();return}if(n<0||n>=SCREENS.length)return;i=n;easy=false;ent={d:'',c:''};tries=0;billDone=false;$('easy').setAttribute('aria-pressed','false');render();if(SCREENS[i].end)party();else SFX.whoosh();sayQ(SCREENS[i])}
$('next').onclick=()=>go(i+1);
$('skip').onclick=()=>go(i+1);
$('back').onclick=()=>go(i-1);
$('easy').onclick=()=>{easy=!easy;$('easy').setAttribute('aria-pressed',easy);SFX.click();render()};
$('snd').onclick=()=>{sound=!sound;$('snd').setAttribute('aria-pressed',sound);if(!sound)hush();SFX.click()};
document.addEventListener('keydown',e=>{if(!$('open').hidden){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('startbtn').click()}return}if(e.target&&e.target.tagName==='INPUT')return;if(SCREENS[i].bill&&!billDone){if(/^[0-9]$/.test(e.key)){e.preventDefault();billKey(e.key);return}if(e.key==='Enter'){e.preventDefault();checkBill();return}}if(e.key==='ArrowRight'&&!$('next').hidden)go(i+1);if(e.key==='ArrowLeft')go(i-1)});
function start(d){i=Math.min(d.i||0,SCREENS.length-1);done=new Set(d.done||[]);place=MENU[d.place]?d.place:'panda';order=Array.isArray(d.order)?d.order:[];render();if(d.opened||i>0||done.size)opened=true;else showOpen()}
window.claude?.hot?.snapshot?.(()=>({i,done:[...done],place,opened,order}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
